# Go2 Nav2 파라미터 (ROS 2 Humble)
#
# 원본: Wego-Robot-Engeering-Team/go2 (foxy) wego_2d_nav/config/nav2_params.yaml
# 실주행에서 검증된 NavFn + Regulated Pure Pursuit 조합을 옮긴 것이다.
# 값은 원본 그대로이고, Humble에서 이름이 바뀌거나 새로 생긴 항목만 조정했다.

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.02
    alpha2: 0.006
    alpha3: 0.02
    alpha4: 0.006
    alpha5: 0.02
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"

    # Humble AMCL은 pluginlib으로 로드한다. "differential"로 줄여 쓰면 로드에 실패한다.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    laser_model_type: "likelihood_field"
    max_beams: 45
    laser_max_range: 20.0   # go2_pointcloud_to_laserscan.yaml의 range_max와 맞춘다
    laser_min_range: -1.0
    laser_likelihood_max_dist: 1.5
    sigma_hit: 0.3
    beam_skip_distance: 1.0
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.5
    do_beamskip: false
    lambda_short: 0.1
    max_particles: 1200
    min_particles: 400
    pf_err: 0.1
    pf_z: 0.99

    # 켜면 정합이 잠깐 나빠질 때 파티클이 재주입되며 위치가 튄다.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    resample_interval: 1
    save_pose_rate: 0.5
    set_initial_pose: false   # RViz의 2D Pose Estimate로 지정한다
    tf_broadcast: true

    # 스캔 파이프라인 지연을 흡수한다. 줄이면 TF 외삽 실패로 주행이 중간에 끊긴다.
    transform_tolerance: 1.0

    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.03
    z_rand: 0.4
    z_short: 0.07
    scan_topic: /scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /go2/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    # go2_navigation.launch.py가 behavior_trees/ 의 설치 경로로 덮어쓴다.
    # 여기에 직접 적어도 반영되지 않는다.
    default_nav_to_pose_bt_xml: ""

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.1
    failure_tolerance: 1.0   # 명령을 못 만들어도 이 시간(초)은 버틴다. 줄이면 abort가 빨라진다
    odom_topic: /go2/odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 30초 안에 0.15 m를 못 가면 진행 실패. 좁은 곳에서 감속·회전할 시간을 허용한다.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 30.0

    # 조이면 다리 로봇 특성상 목표 근처에서 자세를 못 맞추고 진동한다.
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.6
      yaw_goal_tolerance: 0.9
      stateful: true

    # 전방 속도와 yaw만 낸다. 횡속도는 쓰지 않는다.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8
      lookahead_dist: 0.8
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.8
      min_approach_linear_velocity: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.3    # 위가 false라 미동작
      cost_scaling_gain: 1.0    # 위가 false라 미동작
      inflation_cost_scaling_factor: 1.8   # local_costmap의 cost_scaling_factor와 같아야 한다
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.3   # 곡률 구간에서 기어가다 멈추는 것을 막는다
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.2
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 2.0
      use_interpolation: true
      # 선가속 제한은 Humble RPP에서 빠졌다. velocity_smoother가 담당한다.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.8
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.43, 0.17], [0.43, -0.17], [-0.37, -0.17], [-0.37, 0.17]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.8
        inflation_radius: 0.25
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.8
      # 후방 길이가 local(-0.37)과 다르다. 원본 값이고 local이 더 보수적이라 유지한다.
      footprint: "[[0.43, 0.17], [0.43, -0.17], [-0.32, -0.17], [-0.32, 0.17]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""   # launch의 map 인자가 덮어쓴다

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0   # Humble은 초 단위 (Foxy는 ms)
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true   # false로 두면 미탐색 구간에서 "경로 없음"으로 멈춘다

# 현재 BT가 SmoothPath를 호출하지 않아 쓰이지 않지만, bringup이 노드를 띄우므로 남겨 둔다.
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0

    # min_rotational_vel이 낮으면 Go2가 실제로 돌지 않아 spin recovery가 헛돈다.
    max_rotational_vel: 2.0
    min_rotational_vel: 1.3
    rotational_acc_lim: 10.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# controller_server -> /cmd_vel_nav -> velocity_smoother -> /cmd_vel 순서라
# 이 노드가 로봇에 나가는 마지막 관문이다. 좁게 잡으면 여기가 병목이 되어
# 주행 중 멈춘 것처럼 보인다. 상위 명령의 상한을 모두 포함해야 한다.
#   0.8 / 1.2  : FollowPath.desired_linear_vel, 원본 RPP의 선가속
#   2.0 / 10.0 : behavior_server의 max_rotational_vel, rotational_acc_lim
# 횡속도(y)는 0이다. RPP가 횡속도를 내지 않는다.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [1.2, 0.0, 10.0]
    max_decel: [-1.2, 0.0, -10.0]
    odom_topic: /go2/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
